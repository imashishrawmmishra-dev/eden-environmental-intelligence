# EDEN Production Nginx Reverse-Proxy & SSL Configuration
# Domains: app.edenenvironment.com & api.edenenvironment.com

# 1. HTTP Redirection to HTTPS (Certbot managed)
server {
    listen 80;
    listen [::]:80;
    server_name app.edenenvironment.com api.edenenvironment.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. EDEN Web Application (app.edenenvironment.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.edenenvironment.com;

    # SSL Certificates (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/app.edenenvironment.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.edenenvironment.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers (Student Privacy & Protection)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    root /var/www/eden/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1d;
    }

    # Proxy /api requests if called from same domain
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. EDEN FastAPI Backend Engine (api.edenenvironment.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.edenenvironment.com;

    # SSL Certificates (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/api.edenenvironment.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.edenenvironment.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types application/json text/plain text/xml;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
