<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDEN — Environmental Intelligence & Learning (Self-Contained Client)</title>
  <style>
    :root {
      --bg: #020617;
      --card: #0f172a;
      --border: #1e293b;
      --primary: #10b981;
      --primary-hover: #059669;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .brand { font-size: 20px; font-weight: bold; color: var(--primary); }
    .badge {
      font-size: 11px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 9999px;
    }
    .search-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .input-row { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      background: #020617;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
    }
    input[type="text"]:focus { outline: none; border-color: var(--primary); }
    button.submit-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button.submit-btn:hover { background: var(--primary-hover); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 12px;
    }
    .answer-text { font-size: 14px; color: #e2e8f0; white-space: pre-wrap; margin-bottom: 16px; }
    .formula-box {
      background: #020617;
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      color: #34d399;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">🌱 EDEN <span style="color:#94a3b8; font-size:14px; font-weight:normal;">| Environmental Intelligence</span></div>
      <div class="badge">Standalone Web Client v5.2.0</div>
    </header>

    <div class="search-box">
      <div class="input-row">
        <input type="text" id="queryInput" placeholder="Ask about BOD/DO, carbon budget, Streeter-Phelps, or environmental policy..." value="What is the relationship between BOD and Dissolved Oxygen (DO) in aquatic ecosystems?">
        <button class="submit-btn" id="askBtn" onclick="askEden()">Ask EDEN</button>
      </div>
    </div>

    <div id="resultContainer" style="display:none;">
      <div class="card">
        <div class="card-title">Environmental Intelligence Synthesis</div>
        <div class="answer-text" id="answerText"></div>
        <div class="formula-box" id="formulaText"></div>
      </div>
    </div>
  </div>

  <script>
    async function askEden() {
      const q = document.getElementById('queryInput').value;
      if (!q.trim()) return;
      const btn = document.getElementById('askBtn');
      btn.innerText = 'Reasoning...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/v1/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q, mode: 'offline' })
        });
        const data = await res.json();
        document.getElementById('resultContainer').style.display = 'block';
        document.getElementById('answerText').innerText = data.answer;
        if (data.primaryNodes && data.primaryNodes[0] && data.primaryNodes[0].formulaOrMetric) {
          document.getElementById('formulaText').style.display = 'block';
          document.getElementById('formulaText').innerText = 'Formula: ' + data.primaryNodes[0].formulaOrMetric;
        } else {
          document.getElementById('formulaText').style.display = 'none';
        }
      } catch (err) {
        alert('Could not connect to API: ' + err.message);
      } finally {
        btn.innerText = 'Ask EDEN';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
